# Read by /usr/local/bin/steam-session (restart steam-session.service after editing).
# gamepadui = Big Picture, desktop = desktop client
STEAM_UI=gamepadui
# 1 = re-expose the built-in pad as an Xbox 360 pad through uinput (padmap)
PADMAP=0
# 1 = let CEF use the GPU (Panfrost GLES); 0 = software raster
CEF_GPU=0
STEAM_EXTRA_ARGS=
