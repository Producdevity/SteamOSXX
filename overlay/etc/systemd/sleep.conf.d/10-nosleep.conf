# Sleep is not supported yet: the TF-A in this image has no H616 PSCI system-suspend, and the watchdog does not cover a
# hung suspend. Refuse it so Steam's power-menu "Sleep" fails instead of freezing the handheld (docs/findings.md).
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
