# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# The RG40XX-H's built-in pad (ROCKNIX's single-ADC joypad driver) presented to Steam as a Steam Deck controller.
version: 1
kind: CompositeDevice
name: Anbernic RG40XX-H

options:
  auto_manage: true

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: compatible
          value: anbernic,rg40xx-h

source_devices:
  - group: gamepad
    evdev:
      name: H700 Gamepad
      phys_path: rocknix-singleadc-joypad/input0
      vendor_id: "484b"
      product_id: "14df"
      handler: event*

target_devices:
  - deck
